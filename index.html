<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#254e37" />
  <meta name="description" content="Darvi Billing – multi-business billing, phone lookup, lead CRM, quotations, shipping label printing and Vikshha plot registry prototype." />
  <title>Darvi Billing — Prototype</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><img src="assets/Official Darvi Group Logo.jpeg" alt="Original Darvi Group logo"/><div class="brand-subtitle">BILLING <span>•</span> POS</div></div>
      <div class="workspace"><span class="workspace-avatar">D</span><div><strong id="workspace-name">Darvi Group Agri Tech</strong><small>Business workspace · Demo</small></div></div>
      <div class="sidebar-company-switch"><label class="input-label">Switch business</label><select class="field" id="sidebar-business-picker" aria-label="Change business"></select></div><div class="nav-section-label">WORKSPACE</div>
      <nav id="side-nav"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-note"><span class="note-dot"></span><div><strong>Local demo mode</strong><span>Stored on this device only</span></div></div>
      <div class="sidebar-footer">Darvi Billing v0.6 • Prototype</div>
    </aside>
    <div class="content-shell">
      <header class="topbar"><div class="topbar-left"><button id="menuToggle" class="icon-btn mobile-only" aria-label="Open navigation">☰</button><div><div id="page-eyebrow" class="eyebrow">WORKSPACE OVERVIEW</div><h1 id="page-title">Dashboard</h1></div></div><div class="topbar-actions"><label class="business-label"><span>Business</span><select id="business-picker" class="field" aria-label="Select business"></select></label><button id="bt-printer-btn" class="bt-top-btn" data-action="bt-printer-manager" title="Seznik 2POS Bluetooth Printer"><span class="bt-dot"></span><span id="bt-printer-label">🖨️ Printer: Connect</span></button><span class="offline-chip"><span class="note-dot"></span> On-device demo</span><button class="button button-primary top-new" data-action="new-invoice">＋ New invoice</button><button id="account-info" class="user-avatar" title="Signed-in staff">DG</button><button class="signout-btn" data-action="signout" title="Sign out">Sign out</button></div></header>
      <main class="main-content" id="main-content"></main>
      <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>
    </div>
  </div>
  <div id="login-layer" class="login-layer" hidden></div>
  <div class="modal-layer" id="modal-layer" hidden></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <div id="print-sheet"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <input type="file" id="legacy-import-file" accept=".csv,.json,.txt,text/csv,application/json" hidden />
  <script src="thermal-printer.js" defer></script>
  <script src="legacy-vault.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
